# Memorize 原生验收（macOS runner）
# 用途：在没有 Mac 的情况下，用 GitHub 托管的 macOS 机器执行真实的 xcodebuild test，
#       产出 P0-1 所需的 .xcresult 与终端日志。不替代人工录屏（P0-2）。
# 触发：手动（Actions → Run workflow）或推送到 day8 时自动。
# 注意：本文件不会被本地任何脚本执行，也不会自动提交；需要你推送仓库后才会运行。

name: macOS 原生验收

on:
  workflow_dispatch:
  push:
    paths:
      - 'day8/**'
      - '.github/workflows/macos-native-test.yml'

permissions:
  contents: read

jobs:
  native-test:
    name: 原生 132 条（iOS 模拟器）
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 环境信息
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphonesimulator --show-sdk-version)"
          echo "Python: $(python3 --version)"
          sysctl -n hw.model || true

      - name: 选择可用 iPhone 模拟器
        id: pick
        run: |
          set -euo pipefail
          DEV="$(xcrun simctl list devices available \
            | grep -oE 'iPhone [0-9]+( Pro)?' \
            | sort -u | head -1)"
          if [ -z "${DEV:-}" ]; then
            echo "::error::没有可用的 iPhone 模拟器，请检查 runner 的 Xcode 版本"
            xcrun simctl list devices available
            exit 1
          fi
          echo "选中机型：$DEV"
          echo "device=$DEV" >> "$GITHUB_OUTPUT"

      - name: 工程结构自检（3 Target + 共享 Scheme）
        run: |
          set -euo pipefail
          xcodebuild -list -project day8/Memorize.xcodeproj | tee xcodebuild-list.log

      - name: 等价回归（Python，132 条）
        run: |
          set -euo pipefail
          python3 day8/WinTestHarness/run_tests.py | tee equitest.log
          python3 - <<'PY'
          import json
          d = json.load(open('day8/WinTestHarness/test_results.json', encoding='utf-8'))
          s = d.get('summary', {})
          assert s.get('total') == 132, s
          assert s.get('failed') == 0, s
          assert s.get('skipped') == 0, s
          assert d.get('coverage', {}).get('ok') is True, '映射校验未通过'
          print('等价回归判定：132/0/0，映射校验 ok')
          PY

      - name: 原生全量测试（xcodebuild test）
        run: |
          set -o pipefail
          xcodebuild test \
            -project day8/Memorize.xcodeproj \
            -scheme Memorize \
            -destination "platform=iOS Simulator,name=${{ steps.pick.outputs.device }},OS=latest" \
            -resultBundlePath TestResults.xcresult \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            2>&1 | tee xcodebuild-test.log

      - name: 结果解析与判定
        if: always()
        run: |
          echo "==== 各 bundle 汇总 ===="
          grep -E 'Executed [0-9]+ tests?, with' xcodebuild-test.log | tail -6 || echo "未找到 Executed 行"
          echo "==== 状态标记 ===="
          grep -E '\*\* TEST (SUCCEEDED|FAILED) \*\*' xcodebuild-test.log || echo "未找到状态标记"
          {
            echo "### 原生验收结果"
            echo '```'
            grep -E 'Executed [0-9]+ tests?, with' xcodebuild-test.log | tail -6 || true
            grep -E '\*\* TEST (SUCCEEDED|FAILED) \*\*' xcodebuild-test.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memorize-native-evidence
          if-no-files-found: warn
          retention-days: 30
          path: |
            xcodebuild-test.log
            xcodebuild-list.log
            equitest.log
            TestResults.xcresult
